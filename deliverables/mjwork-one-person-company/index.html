  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 8h18M3 8v10h18V8M8 8V5h8v3"/><path d="M12 12v6"/></svg>
        </span>
        <div class="brand-text">
          <b>MJWork</b>
          <span>一个人的软件公司</span>
        </div>
        <button class="side-collapse" id="collapseBtn" type="button" title="折叠侧栏" aria-label="折叠侧栏">
          <svg class="ico" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
        </button>
      </div>

      <button class="company-switch" id="companyBtn" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="company-avatar">北</span>
        <span class="company-meta">
          <b id="companyName">北极星工作室</b>
          <small id="companySub">5 名数字员工 · 交付中</small>
        </span>
        <svg class="ico company-caret" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
      </button>

              <span class="nav-text">对话</span>
              <kbd class="nav-kbd">⌘1</kbd>
            </a>
            <a href="#/studio?tab=space" class="nav-item" data-nav="studio" title="团队工作室（⌘2）">

              <span class="nav-text">团队工作室</span>
              <kbd class="nav-kbd">⌘2</kbd>
            </a>
            <a href="#/ledger" class="nav-item" data-nav="ledger" title="账本（⌘3）">
              <svg class="ico" aria-hidden="true"><use href="#i-ledger"></use></svg>
              <span class="nav-text">账本</span>
              <kbd class="nav-kbd">⌘3</kbd>

            <span class="nav-ind" id="navIndSub" aria-hidden="true"></span>

              <span class="nav-text">生态中心</span>
              <span class="nav-count">66</span>
            </a>
            <a href="#/schedule" class="nav-item" data-nav="schedule" title="定时任务">
              <svg class="ico" aria-hidden="true"><use href="#i-clock"></use></svg>
              <span class="nav-text">定时任务</span>
              <span class="nav-count">3</span>
            </a>
            <a href="#/settings" class="nav-item" data-nav="settings" title="设置（⌘,）">
              <svg class="ico" aria-hidden="true"><use href="#i-settings"></use></svg>
              <span class="nav-text">设置</span>
              <kbd class="nav-kbd">⌘,</kbd>
            </a>
          </div>
        </div>
      </nav>

      <div class="side-bottom">
        <div class="side-budget">
          <div class="sb-row"><span>本月已用</span><b>¥12,480</b></div>
          <div class="sb-bar" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="本月预算使用"><i style="width:62%"></i></div>
          <div class="sb-sub">预算 ¥20,000 · 剩余 ¥7,520</div>
        </div>
        <div class="side-foot">
          <button class="foot-btn" id="themeToggle" type="button" title="切换主题">
            <svg class="ico theme-ico-light" aria-hidden="true"><use href="#i-moon"></use></svg>
            <svg class="ico theme-ico-dark" aria-hidden="true"><use href="#i-sun"></use></svg>
            <span class="nav-text" id="themeLabel">深色模式</span>
          </button>
          <button class="foot-btn owner" id="ownerBtn" type="button" title="老板账户">
            <span class="avatar av-sm">老</span>
            <span class="nav-text">老板账户</span>
          </button>
        </div>
        <button class="replay-btn" id="replayOnboarding" type="button">
          <svg class="ico" aria-hidden="true"><use href="#i-refresh"></use></svg>
          <span class="nav-text">重看首启</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="tb-left">
          <div class="tb-title">
            <h1 id="viewTitle">接单台</h1>
            <p id="crumb">北极星工作室 · 2026 年 10 月 23 日</p>
          </div>
        </div>
        <div class="tb-right">
          <button class="tb-search" id="searchBtn" type="button" aria-label="打开命令面板">
            <svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg>
            <span>搜索</span>
            <kbd>⌘K</kbd>
          </button>
          <button class="icon-btn" id="notifyBtn" type="button" aria-label="通知" aria-haspopup="menu" aria-expanded="false">
            <svg class="ico" aria-hidden="true"><use href="#i-bell"></use></svg>
            <span class="notify-dot" id="notifyDot"></span>
          </button>
          <div class="tb-primary" id="primaryAction"></div>
        </div>
      </header>

      <main class="viewwrap" id="viewwrap">
        <div class="view" id="view"></div>
      </main>
    </div>
