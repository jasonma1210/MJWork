name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  # 2026-10-21：补手动触发入口。此前本工作流只能靠 push/PR 触发，
  # 而仓库历史上有过「push 已成功但 Actions 未产生运行记录」的窗口（L-1 的不可验证项），
  # 没有 workflow_dispatch 就无法在不制造空提交的前提下重跑或诊断。
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mjcode
          POSTGRES_PASSWORD: mjcode
          POSTGRES_DB: mjcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # ── T2-4 防再入门禁：git 跟踪的文件里不允许出现 .bak / .deprecated ──
      # 用 git ls-files（而非 find）：只看入库文件，不受 node_modules 等忽略目录干扰；
      # 即便有人 git add -f 绕过 .gitignore，这里也会红。
      - name: No .bak / .deprecated in repo (T2-4)
        run: |
          BAD=$(git ls-files | grep -E '\.bak$|\.deprecated' || true)
          if [ -n "$BAD" ]; then
            echo "禁止提交备份/废弃文件（历史恢复走 git，库内不留 .bak）："
            echo "$BAD"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ── 服务端：依赖 + 建库 + 启动 + API 冒烟 ──
      - name: Server install
        working-directory: server
        run: |
          npm ci
          cat > .env <<EOF
          PORT=3001
          DATABASE_URL=postgresql://mjcode:mjcode@localhost:5432/mjcode
          JWT_SECRET=ci-secret-not-for-production
          JWT_EXPIRES=1h
          ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF

      - name: Server init-db
        working-directory: server
        run: npm run init-db

      # ── 服务端：无数据库依赖的单元回归（鉴权 fail-closed / 小程序绑定 / CRDT）──
      - name: Server unit tests
        working-directory: server
        run: npm test

      # ── 服务端：依赖真实 PG 的云端委派测试 ──
      - name: Server db tests
        working-directory: server
        run: npm run test:db

      - name: Server start & e2e smoke
        run: |
          cd server && npm start &
          sleep 3
          cd desktop && node test/e2e-smoke.mjs

      # ── 桌面端：单元/集成测试（electron stub，无显示依赖；与本地 npm test 同一门禁）──
      - name: Desktop install
        working-directory: desktop
        run: npm ci

      # ── 渲染层依赖必须先装：Desktop tests 里有 11 个套件会 require
      #    `renderer/node_modules/{esbuild,typescript}`（smoke-load / render-smoke /
      #    props-contract / undef-ident / thread-models …）。
      #    2026-10-21 首次真实 CI 运行暴露的**顺序缺陷**：原先 renderer 的 npm ci 放在
      #    Desktop tests **之后**，导致这 11 个套件在干净 runner 上必然 MODULE_NOT_FOUND。
      - name: Renderer install (desktop tests import renderer deps)
        working-directory: desktop/renderer
        run: npm ci

      # ── Linux 真机沙箱依赖（L-1 收口）──
      # `sandbox-crossplatform` 的真机段只在「Linux 且 bwrap 存在」时执行；此前 runner 没装
      # bubblewrap，于是长期以「⚠ 跳过」记账，Linux 隔离能力从未被真实验证。
      # 另：Ubuntu 24.04 默认用 AppArmor 限制非特权 user namespace，装了 bwrap 也建不出隔离
      # 命名空间（会被真探测判为 bwrap-broken）。这里显式放开后再跑——若仍失败，门禁会**如实红**，
      # 不会退回「环境限制」的静默跳过。
      - name: Install Linux sandbox deps (bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          bwrap --version

      # 显式打一条「真机隔离可用」证据到 CI 日志：测试套件通过时 run-all 不打印内部断言，
      # 只靠「某个套件绿了」无法证明 bwrap 真跑过。这一步失败即 L-1 不能销账。
      - name: Linux sandbox smoke (real bwrap isolation)
        working-directory: desktop
        run: |
          node -e "
          const l = require('./main/sandboxLinux');
          const s = l.linuxSandboxStatus();
          console.log('linuxSandboxStatus =', JSON.stringify(s));
          if (!s.available) { console.error('bwrap 真机隔离不可用，L-1 不能销账'); process.exit(1); }
          "

      # ── 桌面端：静态检查门禁（P1-6 新增；第六轮 N2 收紧）──
      # ESLint：0 error 硬门禁 + warning 棘轮（--max-warnings=161 = 2026-10-19 实测基线，只降不升）。
      # 原为 --max-warnings=9999（等于只 gate error，warning 无感）；现新增 warning 即红，
      # 清掉一批后需同步下调基线（test/lint-ratchet.test.mjs 守这条棘轮）。
      - name: Desktop lint (ESLint)
        working-directory: desktop
        run: npm run lint

      - name: Desktop tests
        working-directory: desktop
        run: npm test

      # ── 渲染层：类型门禁 + 构建（依赖已在 Desktop tests 之前安装）──
      - name: Renderer typecheck & build
        working-directory: desktop/renderer
        run: |
          npm run typecheck
          npm run build

      # ── 语法门禁：全量扫描（第六轮 N3）──
      # 原实现只 node --check 8 个写死文件（main/main.js 等），**新增文件永不被检查**——假绿。
      # 现改为：server/src + desktop 全部服务端/主进程/引擎/脚本目录的 .js/.mjs 全量 --check，任一文件
      # 语法错误即红。node 按文件最近的 package.json 判定 ESM/CJS，故 agent-core（type:module）同样可被
      # 正确解析；renderer 的 ts/tsx 由 tsc 类型门禁覆盖，不在此扫描（node --check 无法解析 TS）。
      - name: Syntax gate (full scan)
        run: |
          cd server && for f in $(find src -type f -name '*.js' -not -path '*/node_modules/*'); do node --check "$f" || exit 1; done
          cd ../desktop && for f in $(find main agent-core eval scripts shared shared-ipc chrome-extension -type f \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*'); do node --check "$f" || exit 1; done

  # ═══════════════════════════════════════════
  #  发布 job（P0-G）：tag（v*）触发，三平台 matrix 打包
  #  制品纪律：生产包只从 CI 产出，禁止本地 build 直发
  #  签名（默认关闭，secrets 就位即自动启用，无需改工作流）：
  #    mac: CSC_LINK(p12 base64) + CSC_KEY_PASSWORD + APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID（公证）
  #    win: CSC_LINK(pfx base64) + CSC_KEY_PASSWORD
  #    未配置 secrets 时 electron-builder 自动跳过签名/公证，产出未签名包（CI 仍绿）
  #  上传 GitHub Release：仓库设置 → Variables → 新建 PUBLISH_RELEASE=true
  #    （需先在 GitHub 建好仓库，并把 desktop/package.json 的 publish.owner/repo 改成真实值）
  # ═══════════════════════════════════════════
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ${{ matrix.os }}
    # 自动发布需要写权限：默认 GITHUB_TOKEN 是只读的，缺这段会在 --publish always 时
    # 报 "Resource not accessible by integration"（技术设计文档 X3）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # electron-builder 走 GitHub Releases 时需要 token；不注入则 --publish always 必失败
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 签名证书不再写进矩阵 env：空串会被 electron-builder 当成证书文件路径
      # （报错「<cwd> not a file」），故改为在「配置签名密钥」步骤里**仅当密钥存在时**
      # 才 export 到 GITHUB_ENV；无密钥时 CSC_LINK 完全不出现，electron-builder 走
      # 自动发现 → 无密钥则产出未签名包（warning，不致命）。
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      # 配置签名密钥（平台分流）：仅当对应密钥非空才 export CSC_LINK / CSC_KEY_PASSWORD
      # 到 GITHUB_ENV，避免空串触发 electron-builder 的「not a file」致命错误。
      # mac 优先 CSC_LINK_MAC / CSC_KEY_PASSWORD_MAC，win 优先 CSC_LINK_WIN /
      # CSC_KEY_PASSWORD_WIN，均无则回落通用 CSC_LINK / CSC_KEY_PASSWORD。
      - name: Configure code signing from secrets
        shell: bash
        env:
          M_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK_MAC || '' }}
          M_PWD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD_MAC || '' }}
          W_LINK: ${{ matrix.os == 'windows-latest' && secrets.CSC_LINK_WIN || '' }}
          W_PWD: ${{ matrix.os == 'windows-latest' && secrets.CSC_KEY_PASSWORD_WIN || '' }}
          GENERIC_LINK: ${{ secrets.CSC_LINK }}
          GENERIC_PWD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          CSC_LINK="${M_LINK:-${W_LINK:-${GENERIC_LINK:-}}}"
          CSC_PWD="${M_PWD:-${W_PWD:-${GENERIC_PWD:-}}}"
          if [ -n "$CSC_LINK" ]; then
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_PWD" >> "$GITHUB_ENV"
          else
            echo "build 无签名密钥，产出未签名包（CSC_LINK 不设置）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 发布前置检查（元数据门禁）。**必须放在 Sync version from tag 之前**，两个理由：
      #   ① 该 step 末尾的 `npm version` 只改 desktop/package.json（working-directory: desktop），
      #      renderer 与 server 两处不会跟着变 —— 它会**破坏**「三处版本一致」契约。
      #      前置本检查 = 强制「先升版本再打 tag」，于是 Sync 退化为 --allow-same-version 的
      #      幂等空操作，三处一致性自然保持。
      #   ② 它是「忘升版本号就打 tag」的唯一拦截点。没有它，CI 会自动把版本改成 tag 的值，
      #      错误被静默抹平，而 CHANGELOG 与包内版本从此对不上。
      - name: Release preflight
        working-directory: desktop
        shell: bash
        run: node scripts/preflight-release.mjs

      # ── X22：通道解析（beta 通道更新元数据的前提）──
      # 修复前 CI 只产出 latest.yml，从不产出 beta.yml，于是「发 beta 给部分用户先升」
      # 在物理上无法执行——包传上去了，客户端拿不到 beta 的更新描述。
      # 通道由 tag 形态**显式**决定（scripts/resolve-update-channel.mjs，fail-closed）：
      #   v0.1.0        → channel=latest  releaseType=release
      #   v0.1.0-rc.1   → channel=beta    releaseType=prerelease
      # 为什么必须显式传 channel、不能依赖 electron-builder 自动推断：
      #   detectUpdateChannel 默认 true，`0.1.0-rc.1` 会被推断成通道 `rc` → 产出 rc.yml，
      #   而客户端 MJ_UPDATE_CHANNEL 只有 latest/beta 两档，rc.yml 永远无人读取。
      # 非法 tag（空、v、vfoo、latest、1.0 …）脚本直接非零退出中止发布：
      #   把预发布当稳定版推给所有用户不可逆，宁可不发。
      - name: Sync version from tag
        id: channel
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          # 先捕获再 eval：`eval "$(cmd)"` 在 cmd 失败时会 eval 空串并返回 0，
          # 等于把非法 tag 静默放行——必须显式判退出码才能保持 fail-closed。
          CHANNEL_INFO="$(node scripts/resolve-update-channel.mjs "$GITHUB_REF_NAME")" || {
            echo "::error::tag '$GITHUB_REF_NAME' 无法解析为更新通道，已中止发布（fail-closed：绝不把预发布当稳定版推送）"
            exit 1
          }
          eval "$CHANNEL_INFO"
          # 兜底断言：三个变量任一为空都视为解析异常（防止脚本被改坏后静默发错通道）
          for v in CHANNEL RELEASE_TYPE VERSION; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v 为空，通道解析异常，已中止发布"
              exit 1
            fi
          done
          # 本 step 内 $GITHUB_ENV 尚未生效，故用 eval 得到的变量；
          # 同时写 $GITHUB_OUTPUT 供 upload-artifact 的制品名使用。
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "releaseType=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析结果：channel=$CHANNEL releaseType=$RELEASE_TYPE version=$VERSION"
          # VERSION 由脚本给出（已去 v 前缀并通过 semver 校验），不再手写 ${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install & build renderer
        working-directory: desktop
        run: |
          npm ci
          cd renderer && npm ci && npm run build

      # B4（2026-10-28）：macOS 的随包 OCR 必须在这里现做，否则 CI 产物必然缺 Resources/ocr。
      # 成因：build/ocr 被 .gitignore 排除（平台相关二进制不入库），而下面 Package 直接调
      # electron-builder、**不经过** npm run build（那条链才含 bundle:ocr）⇒ 双轨，
      # 表现为「本地打的包有 OCR、CI 发的包没有」。冒烟 R7 会拦住它，但在这里先失败更好定位。
      - name: Bundle OCR (macOS only)
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          brew install tesseract tesseract-lang
          node scripts/bundle-ocr.mjs --force
          # 就地自检：二进制必须可执行、语言数据必须存在（缺任一，后面冒烟必红）
          test -x build/ocr/tesseract
          ls build/ocr/tessdata/*.traineddata

      # 通道相关三个 -c.* 覆盖（X22）：
      #   -c.publish.channel        → 决定产出 <channel>.yml（beta → beta.yml，latest → latest.yml）
      #   -c.publish.releaseType    → beta 必须发成 GitHub prerelease，便于 latest 客户端过滤
      #   -c.generateUpdatesFilesForAllChannels → 顶级 build 字段（**不是** publish 子字段，
      #      放进 publish 会被 electron-builder 25 的 schema 拒绝：GithubOptions.additionalProperties=false）
      # 注意：GitHub provider 下 computeChannelNames 会短路成 [currentChannel]，
      #   即本参数在 GitHub 上不改变产物集合（beta 构建只出 beta.yml，不会顺手覆盖 latest.yml）。
      #   保留它是为了「若将来换 generic/S3 发布源仍能一次产全通道 yml」，属显式声明意图。
      - name: Package
        working-directory: desktop
        shell: bash
        # 显式从解析 step 的 outputs 取通道变量，不依赖 GITHUB_ENV 的隐式传播
        # （脚本虽写了 GITHUB_ENV，但显式 env 让本步骤自解释，也避免 step 重排后静默拿空值）。
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          RELEASE_TYPE: ${{ steps.channel.outputs.releaseType }}
        run: |
          set -euo pipefail
          npx electron-builder \
            -c.publish.channel="$CHANNEL" \
            -c.publish.releaseType="$RELEASE_TYPE" \
            -c.generateUpdatesFilesForAllChannels=true \
            --publish ${{ vars.PUBLISH_RELEASE == 'true' && 'always' || 'never' }}

      # B6（2026-10-28）：打包产物冒烟 —— 针对**真实产物**的唯一验证。
      # 源码级 300+ 套件拦不住「打包态才出现」的问题：better-sqlite3 SIGSEGV、safeStorage 不可用、
      # asarUnpack 失效、OCR 缺语言数据、Info.plist 版本与包内 package.json 不一致。
      #
      # ⚠ 已知局限（必须知道）：--publish always 在**上面的 Package step 内**就完成了上传，
      #   所以发布流水线里本步骤失败时，坏包已经挂在 Releases 上，需要人工下架。
      #   非发布流程（PR / push，PUBLISH_RELEASE 非 true）不受影响 —— 坏包不会进入制品。
      #   彻底解法是把 publish 拆成独立 step 并在本步骤之后执行（需真机验证，见交付报告残余项）。
      #
      # 仅 macOS：win/linux 的 unpacked 目录形态尚未真机验证，不引入未验证的 CI 失败。
      - name: Smoke test packaged artifact (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        shell: bash
        run: node scripts/smoke-packaged.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # 制品名带通道（X22）：便于在 Actions 页一眼区分 latest / beta 产物，
          # 也避免同 sha 同时发过稳定版与预发布时命名冲突。
          name: MJCode-${{ matrix.os }}-${{ steps.channel.outputs.channel }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.zip
            desktop/release/*.yml
            desktop/release/*.blockmap
