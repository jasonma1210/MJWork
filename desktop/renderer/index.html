<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    P0-S2 修复：补Content-Security-Policy。
    事故背景：本文件此前完全没有 CSP 声明。Electron 渲染层默认 nodeIntegration 关闭、
    contextIsolation 开启，理论上不该有 XSS 面；但一旦出现（依赖投毒、Markdown 渲染、
    未来引入外部内容渲染等），就没有第二道防线——而 market:installGit 这类 IPC 一旦被
    渲染层任意调用即可安装插件，破坏面极大。纵深防御要求：主进程侧已做字段白名单与参数剥离，
    这里再加浏览器侧的内容来源限制。

    取舍说明：
    · script-src 用 sha256 哈希而非 'unsafe-inline'，因为下方主题前置脚本必须内联
      （用于消除启动 dark→light 闪变），而放通 'unsafe-inline' 等于 CSP 对 XSS 形同虚设。
    · style-src 保留 'unsafe-inline'：Tailwind 与 React 内联样式需要它。
    · img/font/connect 覆盖本地协议与 data:，不放开任意外域。
    · T3-1：mjpreview: 为自定义流式预览协议（一次性 token 映射主进程已校验路径），
      大文件字节不再 base64 过 IPC；img/media/frame 三处放行该 scheme。
    · Vite dev 走同一文件，dev server 的 ws: 已显式放开，避免影响本地开发。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'sha256-ryBujN7qL/S028i3xoxNy3xI5m2BJ2OdAscfQyFMx3Q=';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: mjpreview:;
    media-src 'self' data: blob: mjpreview:;
    frame-src 'self' data: blob: mjpreview:;
    font-src 'self' data:;
    connect-src 'self' data: blob: ws://localhost:5173 ws://127.0.0.1:5173;
    object-src 'none';
    base-uri 'none';
    form-action 'none';
    frame-ancestors 'none';
  " />
  <title>MJ Nexus</title>
  <script>
    // TH6：React 挂载前先落主题，消除启动时 dark→light 闪变
    try {
      var t = localStorage.getItem('mj_theme');
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      // TH5：自定义强调色一并前置（内联变量优先于主题定义）
      var accent = localStorage.getItem('mj_accent');
      if (accent) {
        document.documentElement.style.setProperty('--theme-accent', accent);
        document.documentElement.style.setProperty('--sem-accent', accent);
        // 视觉修复：hex 必须与 rgb 三元组成对写入。React 挂载前若只有 hex，
        // bg-accent/10、border-accent/40 这类透明度类会退回主题色（与 lib/color.ts 同一条纪律）。
        var h = String(accent).replace('#', '');
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        if (/^[0-9a-fA-F]{6}$/.test(h)) {
          var rgb = parseInt(h.slice(0, 2), 16) + ' ' + parseInt(h.slice(2, 4), 16) + ' ' + parseInt(h.slice(4, 6), 16);
          document.documentElement.style.setProperty('--theme-accent-rgb', rgb);
          document.documentElement.style.setProperty('--sem-accent-rgb', rgb);
        }
      }
    } catch (e) {}
  </script>
  <style>
    /* TH6b：theme.css（经 main.jsx import 的外部样式）加载前的预绘背景，消除冷启动白屏/闪变。
       背景由上方内联主题脚本写出的 data-theme 驱动；这些 hex 必须与 styles/theme.css
       各 [data-theme] 的 --theme-bg 保持一致，改主题底色时两处同改。
       用内联 <style>（CSP style-src 已允许 'unsafe-inline'）而非改上面脚本——那会动其 sha256 使 CSP 拦截。 */
    html { background: #0d0d0d; color-scheme: dark; }
    html[data-theme="light"] { background: #ffffff; color-scheme: light; }
    html[data-theme="midnight"] { background: #0a0e1a; }
    html[data-theme="forest"] { background: #0c120e; }
    html[data-theme="sunset"] { background: #1a0f0a; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
